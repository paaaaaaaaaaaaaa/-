<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes" />
    <title>КиберСфера — ВКонтакте</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ==================== БАЗОВЫЕ СТИЛИ ==================== */
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00c8;
            --neon-purple: #9d00ff;
            --neon-green: #00ff88;
            --neon-yellow: #ffee00;
            --dark-bg: #0a0a12;
            --panel-bg: rgba(15, 15, 25, 0.92);
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0c0;
            --glow-cyan: 0 0 15px rgba(0, 243, 255, 0.5);
            --border-glow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        /* ==================== ШАПКА ==================== */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0 16px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .back-btn {
            color: var(--neon-cyan);
            text-decoration: none;
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 50%;
            transition: all 0.3s;
            background: rgba(0, 243, 255, 0.05);
        }
        .back-btn:hover {
            background: rgba(0, 243, 255, 0.15);
            box-shadow: var(--glow-cyan);
            transform: scale(1.05);
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            flex: 1;
        }

        .header-badge {
            background: rgba(0, 243, 255, 0.15);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 243, 255, 0.3);
            white-space: nowrap;
        }

        /* ==================== ИНФО О СООБЩЕСТВЕ ==================== */
        .community-info {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            padding: 20px 16px;
            margin-bottom: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        .community-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            box-shadow: var(--glow-cyan);
            position: relative;
        }
        .community-avatar::after {
            content: '';
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--dark-bg);
        }
        .community-avatar span {
            position: relative;
            z-index: 1;
        }

        .community-name {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: var(--glow-cyan);
            margin-bottom: 4px;
        }

        .community-members {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .community-desc {
            color: var(--text-primary);
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .community-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .vk-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #0077FF;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 119, 255, 0.4);
            transition: all 0.3s;
            cursor: pointer;
        }
        .vk-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 119, 255, 0.6);
        }

        .refresh-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px 20px;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .refresh-btn:hover {
            background: rgba(0, 243, 255, 0.2);
            box-shadow: var(--glow-cyan);
        }

        /* ==================== ЛЕНТА ПОСТОВ ==================== */
        .feed {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 20px;
            overflow-y: auto;
        }

        .post-card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.15);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .post-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: var(--border-glow);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .post-date {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .post-text {
            color: var(--text-primary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .post-image {
            max-width: 100%;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(0, 243, 255, 0.1);
        }

        .post-stats {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding-top: 12px;
            border-top: 1px solid rgba(0, 243, 255, 0.08);
        }
        .post-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ==================== СОСТОЯНИЯ ЗАГРУЗКИ ==================== */
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 243, 255, 0.2);
            border-top-color: var(--neon-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 30px 20px;
            background: rgba(255, 0, 200, 0.08);
            border: 1px solid var(--neon-pink);
            border-radius: 16px;
            color: var(--neon-pink);
        }
        .error h3 {
            margin-bottom: 8px;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        /* ==================== АДАПТИВНОСТЬ ==================== */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .header-title { font-size: 1.2rem; }
            .community-name { font-size: 1.2rem; }
            .vk-btn { padding: 10px 18px; font-size: 0.8rem; }
            .post-text { font-size: 0.9rem; }
        }

        @media (min-width: 768px) {
            body { max-width: 600px; margin: 0 auto; }
        }

        /* ==================== СВЕТЛАЯ ТЕМА (опционально) ==================== */
        .light-theme {
            --dark-bg: #f0f2f5;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6e;
            --neon-cyan: #008cff;
            --neon-pink: #d400a6;
        }
        /* Чтобы включить светлую тему, добавьте класс light-theme на body */
    </style>
</head>
<body>

    <!-- ====== ШАПКА ====== -->
    <header class="header">
        <a href="javascript:history.back()" class="back-btn" aria-label="Назад">←</a>
        <div class="header-title">КиберСфера VK</div>
        <span class="header-badge">📱 Мобильная версия</span>
    </header>

    <!-- ====== ИНФО О СООБЩЕСТВЕ ====== -->
    <div class="community-info" id="communityInfo">
        <div class="community-avatar"><span>⚡</span></div>
        <div class="community-name">КиберСфера</div>
        <div class="community-members">👥 <span id="membersCount">1250</span> подписчиков</div>
        <div class="community-desc">Лучший киберспортивный клуб в городе! Турниры, игровые зоны, VR и многое другое.</div>
        <div class="community-actions">
            <a href="https://vk.com/kibersfera" target="_blank" class="vk-btn">👥 Перейти в VK</a>
            <button class="refresh-btn" id="refreshFeedBtn">🔄 Обновить</button>
        </div>
    </div>

    <!-- ====== ЛЕНТА ====== -->
    <div class="feed" id="feedContainer">
        <!-- Контент будет загружен динамически -->
    </div>

    <!-- ====== ПОДВАЛ ====== -->
    <footer style="
        margin-top: 20px;
        padding: 16px 0;
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.8rem;
        border-top: 1px solid rgba(0, 243, 255, 0.1);
        flex-shrink: 0;
    ">
        © 2025 КиберСфера · Мобильная версия
    </footer>

    <script>
        // ================================================================
        //  ДЕМО-ДАННЫЕ ДЛЯ ЛЕНТЫ (имитация постов ВКонтакте)
        // ================================================================
        const DEMO_POSTS = [{
            date: Date.now() - 86400 * 1000,
            text: '🎮 Турнир по Counter-Strike 2 уже на этой неделе! Призовой фонд 50 000 ₽. Успейте зарегистрироваться!',
            image: null,
            likes: 42,
            comments: 12,
            reposts: 5
        }, {
            date: Date.now() - 172800 * 1000,
            text: 'Мы обновили наш парк игровых ПК! Теперь все компьютеры оснащены RTX 4080 и процессорами Intel i9 13-го поколения. Приходите тестировать!',
            image: 'https://via.placeholder.com/600x300/00f3ff/0a0a12?text=Gaming+PC+RTX+4080',
            likes: 78,
            comments: 25,
            reposts: 10
        }, {
            date: Date.now() - 259200 * 1000,
            text: 'Новая VR зона теперь доступна! Испытайте виртуальную реальность на оборудовании Oculus Quest 2. Погружение гарантировано.',
            image: null,
            likes: 56,
            comments: 18,
            reposts: 7
        }, {
            date: Date.now() - 345600 * 1000,
            text: 'Специальное предложение для студентов: скидка 20% на игровое время по будням с 12:00 до 17:00. Предъявите студенческий!',
            image: null,
            likes: 34,
            comments: 8,
            reposts: 3
        }, {
            date: Date.now() - 432000 * 1000,
            text: 'Запускаем новый турнир по Dota 2! Регистрация открыта до 20 мая. Призовой фонд 75 000 ₽. Собирайте команду и побеждайте!',
            image: 'https://via.placeholder.com/600x300/ff00c8/0a0a12?text=Dota+2+Tournament',
            likes: 89,
            comments: 31,
            reposts: 14
        }];

        // ================================================================
        //  КЛАСС ДЛЯ РАБОТЫ С ЛЕНТОЙ
        // ================================================================
        class VKMobileFeed {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.posts = [];
                this.loading = false;
                this.init();
            }

            init() {
                // Загружаем посты из localStorage или используем демо
                const saved = localStorage.getItem('vk_mobile_posts');
                if (saved) {
                    try {
                        this.posts = JSON.parse(saved);
                    } catch {
                        this.posts = DEMO_POSTS.slice();
                    }
                } else {
                    this.posts = DEMO_POSTS.slice();
                    this.saveToStorage();
                }
                this.render();
            }

            saveToStorage() {
                localStorage.setItem('vk_mobile_posts', JSON.stringify(this.posts));
            }

            // Имитация загрузки с сервера
            async fetchPosts() {
                if (this.loading) return;
                this.loading = true;
                this.showLoading();

                // Имитируем сетевую задержку
                await new Promise(resolve => setTimeout(resolve, 1200));

                // В реальном приложении здесь был бы запрос к VK API
                // Используем демо-данные, но можем добавить случайные изменения
                const newPosts = DEMO_POSTS.map(p => ({
                    ...p,
                    date: p.date - Math.floor(Math.random() * 86400 * 1000 * 5) // сдвиг дат
                }));
                // Добавляем новый пост для демонстрации
                const freshPost = {
                    date: Date.now() - 600000, // 10 минут назад
                    text: '🔥 Только что: В нашем клубе стартует новый киберспортивный сезон! Следите за анонсами.',
                    image: null,
                    likes: 12,
                    comments: 4,
                    reposts: 2
                };
                this.posts = [freshPost, ...newPosts];
                this.saveToStorage();
                this.loading = false;
                this.render();
            }

            showLoading() {
                this.container.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Загрузка новостей...</p>
                    </div>
                `;
            }

            render() {
                if (!this.posts || this.posts.length === 0) {
                    this.container.innerHTML = `
                        <div class="empty">
                            <p>Новостей пока нет. Загляните позже!</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                this.posts.forEach(post => {
                    const dateStr = new Date(post.date).toLocaleDateString('ru-RU', {
                        day: 'numeric', month: 'long', year: 'numeric'
                    });
                    const imageHtml = post.image ? `<img src="${post.image}" alt="Пост" class="post-image" onerror="this.style.display='none'">` : '';
                    html += `
                        <div class="post-card">
                            <div class="post-header">
                                <span class="post-date">📅 ${dateStr}</span>
                            </div>
                            <div class="post-text">${post.text.replace(/\n/g, '<br>')}</div>
                            ${imageHtml}
                            <div class="post-stats">
                                <span>❤️ ${post.likes}</span>
                                <span>💬 ${post.comments}</span>
                                <span>↩️ ${post.reposts}</span>
                            </div>
                        </div>
                    `;
                });
                this.container.innerHTML = html;
            }

            // Метод для ручного обновления
            async refresh() {
                await this.fetchPosts();
            }
        }

        // ================================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            const feed = new VKMobileFeed('feedContainer');

            // Кнопка обновления
            document.getElementById('refreshFeedBtn').addEventListener('click', function() {
                this.textContent = '⏳ Загрузка...';
                this.disabled = true;
                feed.refresh().then(() => {
                    this.textContent = '🔄 Обновить';
                    this.disabled = false;
                }).catch(() => {
                    this.textContent = '🔄 Обновить';
                    this.disabled = false;
                });
            });

            // Обновляем количество подписчиков (имитация)
            const membersSpan = document.getElementById('membersCount');
            if (membersSpan) {
                const base = 1250;
                const variation = Math.floor(Math.random() * 50) - 25;
                membersSpan.textContent = base + variation;
            }

            // Автоматическая загрузка при первом открытии
            // (уже загружено в конструкторе)
        });
    </script>
</body>
</html>
